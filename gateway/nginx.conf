# Gateway de desarrollo: origen unico para los dos frontends Angular delante
# de los 6 microservicios. Solo enruta y resuelve CORS -- el JWT lo sigue
# validando cada microservicio contra POST /auth/validate de auth-service.

map $http_origin $cors_origin {
    default "";
    "~^http://localhost:(4200|4201|8091|8092)$" $http_origin;
}

server {
    listen 80;

    client_max_body_size 5m;

    # auth-service (8081)
    location /auth {
        include /etc/nginx/cors.inc;
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/clientes {
        include /etc/nginx/cors.inc;
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/usuarios {
        include /etc/nginx/cors.inc;
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # comercio-service (8082)
    location /api/comercios {
        include /etc/nginx/cors.inc;
        proxy_pass http://comercio-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/productos {
        include /etc/nginx/cors.inc;
        proxy_pass http://comercio-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # pedido-service (8083)
    location /api/carrito {
        include /etc/nginx/cors.inc;
        proxy_pass http://pedido-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/pedidos {
        include /etc/nginx/cors.inc;
        proxy_pass http://pedido-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # fidelidad-service (8085) -- solo endpoints de usuario/JWT; /validar y
    # /saldo son internos con X-Service-Key y no pasan por aqui desde el front
    location /api/cupones {
        include /etc/nginx/cors.inc;
        proxy_pass http://fidelidad-service:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/puntos {
        include /etc/nginx/cors.inc;
        proxy_pass http://fidelidad-service:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # notificacion-service (8086)
    location /api/notificaciones {
        include /etc/nginx/cors.inc;
        proxy_pass http://notificacion-service:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # pago-service no expone REST -- deliberadamente sin location
}
