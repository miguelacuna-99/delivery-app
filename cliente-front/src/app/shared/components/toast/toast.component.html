<div class="ui-toast-container">
  @for (toast of toastsOrdenados(); track toast.id; let i = $index) {
    <div
      class="ui-toast"
      [class]="'ui-toast--' + toast.type"
      [class.ui-toast--removing]="toast.removing"
      [style.--stack-index]="i"
      role="status"
      (click)="dismiss(toast.id)"
    >
      <span class="ui-toast__icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.5 12.5l2.5 2.5 4.5-5.5" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M9.5 9.5l5 5m0-5l-5 5" />
            </svg>
          }
          @case ('warning') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5l9.5 16.5h-19L12 3.5z" />
              <path d="M12 9.5v4.25" />
              <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 8.25v.01M12 11v4.75" />
            </svg>
          }
        }
      </span>
      <span class="ui-toast__message">{{ toast.message }}</span>
    </div>
  }
</div>
