<div class="ui-input">
  @if (label()) {
    <label [for]="inputId" class="ui-input__label">{{ label() }}</label>
  }
  <input
    [id]="inputId"
    class="ui-input__field"
    [class.ui-input__field--error]="error()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
  />
  @if (error()) {
    <p class="ui-input__error">{{ error() }}</p>
  }
</div>
